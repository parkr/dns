on:
  push:
    branches:
      - main
      - github-actions
  workflow_dispatch:

name: Deploy on push
jobs:
  deployOnPush:
    name: octodns sync
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: cachix/install-nix-action@v32
    - name: octodns sync
      env:
        CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
        CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
      run: nix develop --command octodns-sync --config-file ./config/production.yaml --doit
